name: Organic AI OS CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov fastapi uvicorn watchdog pydantic httpx
      - name: Compile check
        run: python -m compileall app.py config.py bio_formats.py api_server.py 10_symbiom 12_phenotype 11_evolution
      - name: Regressions-Suite
        run: python -m pytest tests/test_regression.py -v
      - name: Full tests + coverage
        run: python -m pytest tests/ --cov=. --cov-report=term-missing