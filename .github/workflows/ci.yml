name: Organic AI OS CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov fastapi uvicorn watchdog pydantic httpx
      - name: Compile check (alle Layer)
        run: python -m compileall app.py config.py bio_formats.py api_server.py tool_registry.py watcher.py core 09_neuro 10_symbiom 11_evolution 12_phenotype 13_ui
      - name: Weak-Code-Audit + Regressions-Loop
        run: python tools/regression_loop.py --loop 1
      - name: Regressions-Suite
        run: python -m pytest tests/test_regression.py -v
      - name: Full tests + coverage
        run: python -m pytest tests/ --cov=. --cov-report=term-missing